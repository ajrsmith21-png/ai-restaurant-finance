<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login</title>

<style>

/* ===== BASE ===== */
body{
  margin:0;
  height:100vh;
  display:flex;
  font-family: Arial, sans-serif;
  color:white;
  background:#0b1220;
}

/* ===== LEFT PANEL (branding / SaaS feel) ===== */
.left{
  flex:1;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:80px;
}

.logo{
  font-size:28px;
  font-weight:700;
  margin-bottom:20px;
}

.tagline{
  font-size:36px;
  font-weight:700;
  line-height:1.2;
  margin-bottom:20px;
}

.subtext{
  color:#94a3b8;
  font-size:16px;
  max-width:400px;
}

/* ===== RIGHT PANEL (login) ===== */
.right{
  width:420px;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:40px;
  border-left:1px solid rgba(255,255,255,0.05);
}

.card{
  width:100%;
}

h1{
  margin:0 0 8px 0;
  font-size:26px;
}

.subtitle{
  color:#94a3b8;
  margin-bottom:25px;
  font-size:14px;
}

/* inputs */
input{
  width:100%;
  padding:12px 14px;
  margin-bottom:14px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.08);
  background:#0b1220;
  color:white;
  outline:none;
  transition:0.2s;
}

input:focus{
  border-color:#3b82f6;
  box-shadow:0 0 0 3px rgba(59,130,246,0.15);
}

/* button */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  color:white;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:translateY(-1px);
  opacity:0.95;
}

/* footer */
.footer{
  margin-top:18px;
  text-align:center;
  font-size:13px;
  color:#94a3b8;
}

.footer a{
  color:#60a5fa;
  text-decoration:none;
}

.footer a:hover{
  text-decoration:underline;
}

/* mobile */
@media (max-width:900px){
  .left{
    display:none;
  }

  .right{
    width:100%;
  }
}

</style>
</head>

<body>

<!-- LEFT MARKETING PANEL -->
<div class="left">

  <div class="logo">RushOps</div>

  <div class="tagline">
    Restaurant intelligence<br/>
    built for modern kitchens
  </div>

  <div class="subtext">
    Track waste, labor, and profitability in real-time. Optimize operations with AI-driven insights built for restaurants.
  </div>

</div>

<!-- RIGHT LOGIN PANEL -->
<div class="right">

  <div class="card">

    <h1>Welcome back</h1>
    <div class="subtitle">Sign in to your dashboard</div>

    <form method="POST">

      <input
        type="email"
        name="email"
        placeholder="Email"
        required
      />

      <input
        type="password"
        name="password"
        placeholder="Password"
        required
      />

      <button type="submit">
        Sign in
      </button>

    </form>

    <div class="footer">
      Don’t have an account?
      <a href="/register">Create one</a>
    </div>

  </div>

</div>

</body>
</html>
