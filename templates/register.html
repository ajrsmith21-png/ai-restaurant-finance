<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account</title>

  <style>

    body{
      font-family: Arial, sans-serif;
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }

    .card{
      width:350px;
      background:#1e293b;
      padding:30px;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    h1{
      margin-top:0;
      margin-bottom:20px;
      font-size:28px;
    }

    form{
      width:100%;
    }

    input{
      width:100%;
      padding:12px;
      margin-bottom:15px;
      border:none;
      border-radius:8px;
      box-sizing:border-box;
      font-size:15px;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#3b82f6;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.2s;
    }

    button:hover{
      opacity:0.9;
    }

    a{
      color:#93c5fd;
      text-decoration:none;
    }

    .footer{
      margin-top:20px;
      text-align:center;
      font-size:14px;
    }

  </style>
</head>
<body>

  <div class="card">

    <h1>Create Account</h1>

<form method="POST">

  <input
    type="text"
    name="first_name"
    placeholder="First Name"
    required
  />

  <input
    type="text"
    name="last_name"
    placeholder="Last Name"
    required
  />

  <input
    type="text"
    name="phone"
    placeholder="Phone Number"
    required
  />

  <input
    type="email"
    name="email"
    placeholder="Email"
    required
  />

  <input
    type="password"
    name="password"
    placeholder="Password"
    required
  />

  <button type="submit">
    Create Account
  </button>

</form>

    <div class="footer">
      Already have an account?
      <a href="/login">
        Login
      </a>
    </div>

  </div>

</body>
</html>
