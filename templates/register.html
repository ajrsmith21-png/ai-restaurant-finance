<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }

    .card{
      width:380px;
      background:#1e293b;
      padding:30px;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    h1{
      margin-top:0;
      margin-bottom:20px;
      font-size:28px;
    }

    input{
      width:100%;
      padding:12px;
      margin-bottom:12px;
      border:none;
      border-radius:8px;
      box-sizing:border-box;
      font-size:15px;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#3b82f6;
      color:white;
      font-size:16px;
      cursor:pointer;
      margin-top:5px;
    }

    button:hover{
      opacity:0.9;
    }

    /* MODAL */
    .modalOverlay{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.6);
      display:none;
      justify-content:center;
      align-items:center;
    }

    .modal{
      width:320px;
      background:#111827;
      padding:25px;
      border-radius:12px;
    }

    .modal p{
      font-size:14px;
      margin-bottom:15px;
      color:#cbd5e1;
    }

  </style>
</head>

<body>

<div class="card">

  <h1>Create Account</h1>

  <!-- MAIN FORM -->
  <form method="POST" id="registerForm">

    <input type="text" name="first_name" placeholder="First Name" required>
    <input type="text" name="last_name" placeholder="Last Name" required>
    <input type="text" name="phone" placeholder="Phone Number" required>

    <input type="email" name="email" placeholder="Email" required>

    <input type="password" name="password" placeholder="Password" required>
    <input type="password" name="confirm_password" placeholder="Confirm Password" required>

    <!-- hidden access key -->
    <input type="hidden" name="access_key" id="access_key">

    <button type="button" id="openModalButton">
      Create Account
    </button>

  </form>

</div>

<!-- MODAL -->
<div class="modalOverlay" id="modalOverlay">

  <div class="modal">

    <p>
      Enter the onboarding access key provided in your welcome email.
    </p>

    <input
      type="text"
      id="accessKeyInput"
      placeholder="Access Key"
    />

    <button id="confirmAccessKeyButton">
      Confirm & Create Account
    </button>

  </div>

</div>

<script>

const openModalButton = document.getElementById("openModalButton");
const modalOverlay = document.getElementById("modalOverlay");
const confirmAccessKeyButton = document.getElementById("confirmAccessKeyButton");
const accessKeyInput = document.getElementById("accessKeyInput");
const hiddenAccessKey = document.getElementById("access_key");
const registerForm = document.getElementById("registerForm");

openModalButton.addEventListener("click", () => {
  modalOverlay.style.display = "flex";
});

confirmAccessKeyButton.addEventListener("click", () => {

  hiddenAccessKey.value = accessKeyInput.value;

  registerForm.submit();

});

</script>

</body>
</html>
