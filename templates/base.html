<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KitchenIQ</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Inter, Arial, sans-serif;
        }

        body{
            background:#0b0f17;
            color:white;
            overflow:hidden;
        }

        .app{
            display:flex;
            width:100%;
            height:100vh;
        }

        /* SIDEBAR */

        .sidebar{
            width:280px;
            background:#111827;
            border-right:1px solid rgba(255,255,255,0.06);
            display:flex;
            flex-direction:column;
            padding:24px;
        }

        .logo{
            font-size:28px;
            font-weight:700;
            margin-bottom:40px;
            color:white;
        }

        .logo span{
            color:#6366f1;
        }

        .nav-section{
            margin-bottom:30px;
        }

        .nav-title{
            color:#6b7280;
            font-size:12px;
            text-transform:uppercase;
            margin-bottom:14px;
            letter-spacing:1px;
        }

        .nav-item{
            display:flex;
            align-items:center;
            gap:14px;
            padding:14px 16px;
            border-radius:14px;
            color:#cbd5e1;
            margin-bottom:8px;
            cursor:pointer;
            transition:0.2s;
            text-decoration:none;
        }

        .nav-item:hover{
            background:#1f2937;
            color:white;
        }

        .nav-item.active{
            background:#6366f1;
            color:white;
        }

        .bottom-user{
            margin-top:auto;
            background:#1a2233;
            border:1px solid rgba(255,255,255,0.06);
            border-radius:18px;
            padding:18px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:14px;
        }

        .user-info{
            display:flex;
            flex-direction:column;
        }

        .user-name{
            font-weight:600;
            margin-bottom:4px;
        }

        .user-role{
            color:#94a3b8;
            font-size:14px;
        }

        .logout-btn{
            width:42px;
            height:42px;
            border-radius:12px;
            background:#111827;
            border:1px solid rgba(255,255,255,0.06);
            color:#cbd5e1;
            display:flex;
            align-items:center;
            justify-content:center;
            transition:0.2s;
            flex-shrink:0;
            text-decoration:none;
        }

        .logout-btn:hover{
            background:#6366f1;
            color:white;
            transform:translateY(-1px);
        }

        /* MAIN */

        .main{
            flex:1;
            overflow-y:auto;
            padding:30px;
        }

        /* TOPBAR */

        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:30px;
        }

        .welcome h1{
            font-size:32px;
            margin-bottom:6px;
        }

        .welcome p{
            color:#94a3b8;
        }

        .top-actions{
            display:flex;
            gap:14px;
        }

        .action-btn{
            background:#1f2937;
            border:1px solid rgba(255,255,255,0.06);
            color:white;
            padding:12px 18px;
            border-radius:14px;
            cursor:pointer;
            transition:0.2s;
        }

        .action-btn:hover{
            background:#2b3548;
        }

        .stats-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
            gap:20px;
            margin-bottom:24px;
        }

        .stat-card{
            background:#111827;
            border:1px solid rgba(255,255,255,0.06);
            border-radius:22px;
            padding:24px;
            position:relative;
            overflow:hidden;
        }

        .stat-card::before{
            content:"";
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:4px;
            background:#6366f1;
        }

        .stat-label{
            color:#94a3b8;
            font-size:14px;
            margin-bottom:14px;
        }

        .stat-value{
            font-size:38px;
            font-weight:700;
            margin-bottom:10px;
        }

        .stat-change{
            color:#22c55e;
            font-size:14px;
        }

        .negative{
            color:#ef4444;
        }

        .content-grid{
            display:grid;
            grid-template-columns:2fr 1fr;
            gap:24px;
            margin-bottom:24px;
        }

        .panel{
            background:#111827;
            border:1px solid rgba(255,255,255,0.06);
            border-radius:24px;
            padding:24px;
        }

        .panel-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:24px;
        }

        .panel-title{
            font-size:20px;
            font-weight:600;
        }

        .dropdown{
            background:#1f2937;
            border:none;
            color:white;
            padding:10px 14px;
            border-radius:12px;
        }

        .chart-placeholder{
            height:320px;
            border-radius:18px;
            background:linear-gradient(
                180deg,
                rgba(99,102,241,0.18),
                rgba(99,102,241,0.02)
            );
            border:1px dashed rgba(255,255,255,0.08);
            display:flex;
            align-items:center;
            justify-content:center;
            color:#94a3b8;
            font-size:18px;
        }

        .ai-card{
            background:linear-gradient(
                135deg,
                #312e81,
                #1e1b4b
            );
        }

        .ai-summary{
            line-height:1.8;
            color:#dbeafe;
        }

        .ai-tag{
            display:inline-block;
            background:rgba(255,255,255,0.12);
            padding:8px 14px;
            border-radius:999px;
            font-size:13px;
            margin-bottom:18px;
        }

        .table-panel{
            margin-top:24px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            text-align:left;
            color:#94a3b8;
            font-weight:500;
            padding-bottom:16px;
        }

        td{
            padding:18px 0;
            border-top:1px solid rgba(255,255,255,0.06);
        }

        .status{
            padding:8px 12px;
            border-radius:999px;
            font-size:12px;
            display:inline-block;
        }

        .high{
            background:rgba(239,68,68,0.16);
            color:#ef4444;
        }

        .medium{
            background:rgba(234,179,8,0.16);
            color:#eab308;
        }

        .low{
            background:rgba(34,197,94,0.16);
            color:#22c55e;
        }

        @media(max-width:1200px){

            .content-grid{
                grid-template-columns:1fr;
            }

        }

        @media(max-width:900px){

            body{
                overflow:auto;
            }

            .app{
                flex-direction:column;
                height:auto;
            }

            .sidebar{
                width:100%;
                border-right:none;
                border-bottom:1px solid rgba(255,255,255,0.06);
            }

            .main{
                padding:20px;
            }

            .topbar{
                flex-direction:column;
                align-items:flex-start;
                gap:20px;
            }

        }

    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div>

            <div class="logo">
                Kitchen<span>IQ</span>
            </div>

            <div class="nav-section">

                <div class="nav-title">Overview</div>

                <a href="/dashboard" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>

                <a href="/waste-analytics" class="nav-item {% if active_page == 'waste' %}active{% endif %}">
                    <i class="fa-solid fa-trash"></i>
                    Waste Analytics
                </a>

                <a href="/labour-tracking" class="nav-item {% if active_page == 'labour' %}active{% endif %}">
                    <i class="fa-solid fa-users"></i>
                    Labor Tracking
                </a>

                <a href="/reports" class="nav-item {% if active_page == 'reports' %}active{% endif %}">
                    <i class="fa-solid fa-chart-pie"></i>
                    Reports
                </a>

            </div>

            <div class="nav-section">

                <div class="nav-title">Management</div>

                <a href="/locations"
                   class="nav-item {% if active_page == 'locations' %}active{% endif %}">

                    <i class="fa-solid fa-store"></i>
                    Locations

                </a>

                <a href="#"
                   class="nav-item">

                    <i class="fa-solid fa-bell"></i>
                    Alerts

                </a>

                <a href="/settings"
                   class="nav-item {% if active_page == 'settings' %}active{% endif %}">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </a>

            </div>

        </div>

        <div class="bottom-user">

            <div class="user-info">

                <div class="user-name">
                    {{ current_user.first_name }} {{ current_user.last_name }}
                </div>

                <div class="user-role">
                    {% if current_user.is_admin %}
                        Administrator
                    {% else %}
                        Restaurant Manager
                    {% endif %}
                </div>

            </div>

            <a href="/logout" class="logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i>
            </a>

        </div>

    </aside>

    <main class="main">

        {% block content %}{% endblock %}

    </main>

</div>
</body>
</html>
